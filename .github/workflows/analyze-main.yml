name: Analyze SMO main

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis libraries
        run: python -m pip install capstone lz4 zstandard

      - name: Analyze NSO
        shell: bash
        run: |
          python <<'PY'
          import hashlib
          import re
          import struct
          from pathlib import Path

          import lz4.block
          import zstandard as zstd
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN

          root = Path("main")
          out = Path("analysis")
          out.mkdir(exist_ok=True)

          blob = root.read_bytes()
          if blob[:4] != b"NSO0":
              raise SystemExit("main is not an NSO0 executable")

          def u32(o):
              return struct.unpack_from("<I", blob, o)[0]

          version = u32(0x04)
          flags = u32(0x0C)

          segs = {
              "text": {
                  "file_off": u32(0x10),
                  "mem_off": u32(0x14),
                  "mem_size": u32(0x18),
                  "file_size": u32(0x60),
                  "compress_bit": 0,
              },
              "rodata": {
                  "file_off": u32(0x20),
                  "mem_off": u32(0x24),
                  "mem_size": u32(0x28),
                  "file_size": u32(0x64),
                  "compress_bit": 1,
              },
              "data": {
                  "file_off": u32(0x30),
                  "mem_off": u32(0x34),
                  "mem_size": u32(0x38),
                  "file_size": u32(0x68),
                  "compress_bit": 2,
              },
          }

          def segment(name, s):
              start = s["file_off"]
              end = start + s["file_size"]
              raw = blob[start:end]
              compressed = bool(flags & (1 << s["compress_bit"]))
              if not compressed:
                  if len(raw) < s["mem_size"]:
                      raise ValueError(
                          f"{name}: file data shorter than mem size "
                          f"(file=0x{len(raw):X}, mem=0x{s['mem_size']:X})"
                      )
                  return raw[:s["mem_size"]]
              if flags & 0x80:
                  return zstd.ZstdDecompressor().decompress(
                      raw, max_output_size=s["mem_size"]
                  )
              return lz4.block.decompress(raw, uncompressed_size=s["mem_size"])

          text = segment("text", segs["text"])
          rodata = segment("rodata", segs["rodata"])
          data = segment("data", segs["data"])

          module_id = blob[0x40:0x60]
          lines = [
              "SMO 1.3.0 main NSO analysis",
              f"file_size=0x{len(blob):X} ({len(blob)} bytes)",
              f"sha256={hashlib.sha256(blob).hexdigest()}",
              f"nso_version=0x{version:X}",
              f"flags=0x{flags:X}",
              f"module_id={module_id.hex()}",
          ]
          for name, s in segs.items():
              lines.append(
                  f"{name}: file=0x{s['file_off']:X} mem=0x{s['mem_off']:X} "
                  f"mem_size=0x{s['mem_size']:X} file_size=0x{s['file_size']:X} "
                  f"compressed={bool(flags & (1 << s['compress_bit']))}"
              )
          (out / "header.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")

          hashes = []
          for name, off, buf in [
              ("text", 0xA0, text),
              ("rodata", 0xC0, rodata),
              ("data", 0xE0, data),
          ]:
              expected = blob[off:off + 0x20]
              actual = hashlib.sha256(buf).digest()
              hashes.append(
                  f"{name}_hash_match={actual == expected} "
                  f"expected={expected.hex()} actual={actual.hex()}"
              )
          (out / "hashes.txt").write_text("\n".join(hashes) + "\n", encoding="utf-8")

          strings = []
          for name, buf, base in [
              ("text", text, segs["text"]["mem_off"]),
              ("rodata", rodata, segs["rodata"]["mem_off"]),
              ("data", data, segs["data"]["mem_off"]),
          ]:
              for m in re.finditer(rb"[ -~]{5,}", buf):
                  s = m.group().decode("ascii", "replace")
                  strings.append((base + m.start(), name, s))
          strings.sort()

          (out / "strings.txt").write_text(
              "\n".join(f"0x{addr:016X} [{seg}] {s}" for addr, seg, s in strings),
              encoding="utf-8"
          )

          keywords = re.compile(
              r"(joy.?con|pro.?controller|controller|motion|throw|cappy|cap.?throw|"
              r"npad|gyro|shake|input|down.?throw|up.?throw|throw.?down)",
              re.I,
          )
          relevant = [x for x in strings if keywords.search(x[2])]
          (out / "relevant_strings.txt").write_text(
              "\n".join(f"0x{addr:016X} [{seg}] {s}" for addr, seg, s in relevant),
              encoding="utf-8"
          )

          md = Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          insns = list(md.disasm(text, segs["text"]["mem_off"]))

          ro_start = segs["rodata"]["mem_off"]
          ro_end = ro_start + len(rodata)

          candidates = []

          # Direct ADR references into rodata.
          for i, ins in enumerate(insns):
              if ins.mnemonic == "adr":
                  for op in ins.operands:
                      if op.type == 2 and ro_start <= op.imm < ro_end:
                          off = op.imm - ro_start
                          m = re.search(rb"[ -~]{5,}", rodata[off:off + 0x180])
                          if m and keywords.search(m.group().decode("ascii", "replace")):
                              candidates.append((i, op.imm, m.group().decode("ascii", "replace")))

          # ADRP resolves to a page; nearby ADD/LDR often supplies the final address.
          for i, ins in enumerate(insns):
              if ins.mnemonic != "adrp":
                  continue
              for op in ins.operands:
                  if op.type != 2:
                      continue
                  page = op.imm & ~0xFFF
                  if not (ro_start - 0x2000 <= page <= ro_end + 0x2000):
                      continue
                  for j in range(i + 1, min(i + 6, len(insns))):
                      nxt = insns[j]
                      if nxt.mnemonic in {"add", "ldr", "ldrb", "ldrh", "ldrsb", "ldrsh"}:
                          for mop in nxt.operands:
                              if mop.type == 3:
                                  target = page + mop.mem.disp
                                  if ro_start <= target < ro_end:
                                      off = target - ro_start
                                      m = re.search(rb"[ -~]{5,}", rodata[off:off + 0x180])
                                      if m and keywords.search(m.group().decode("ascii", "replace")):
                                          candidates.append((j, target, m.group().decode("ascii", "replace")))

          # Also associate exact relevant strings with any nearby text reference.
          for addr, seg, s in relevant:
              if seg != "rodata":
                  continue
              page = addr & ~0xFFF
              for i, ins in enumerate(insns):
                  if ins.mnemonic == "adrp":
                      for op in ins.operands:
                          if op.type == 2 and (op.imm & ~0xFFF) == page:
                              candidates.append((i, addr, s))

          seen = set()
          blocks = []
          for idx, target, label in sorted(candidates):
              start = max(0, idx - 25)
              end = min(len(insns), idx + 55)
              key = (insns[start].address, insns[end - 1].address, target)
              if key in seen:
                  continue
              seen.add(key)

              block = "\n".join(
                  f"0x{x.address:016X}: {x.mnemonic:<8} {x.op_str}"
                  for x in insns[start:end]
              )
              blocks.append(f"TARGET 0x{target:016X} {label}\n{block}")

          (out / "candidate_disassembly.txt").write_text(
              "\n\n".join(blocks[:500]) + "\n",
              encoding="utf-8"
          )

          (out / "text.bin").write_bytes(text)
          (out / "rodata.bin").write_bytes(rodata)

          print("\n".join(lines))
          print(f"relevant_strings={len(relevant)}")
          print(f"reference_candidates={len(candidates)}")
          print(f"instructions={len(insns)}")
          PY

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: smo-main-analysis
          path: analysis/
          if-no-files-found: error
