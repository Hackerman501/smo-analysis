name: SMO 1.3.0 reverse engineering

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu cmake ninja-build
          python -m pip install capstone lz4 zstandard

      - name: Build nx2elf
        run: |
          git clone --depth 1 https://github.com/shuffle2/nx2elf.git /tmp/nx2elf
          cmake -S /tmp/nx2elf -B /tmp/nx2elf/build -G Ninja
          cmake --build /tmp/nx2elf/build -j2

      - name: Convert NSO to ELF
        run: |
          /tmp/nx2elf/build/nx2elf main --export-elf main.elf
          file main.elf
          aarch64-linux-gnu-readelf -h main.elf > elf_header.txt
          aarch64-linux-gnu-readelf -S main.elf > elf_sections.txt
          aarch64-linux-gnu-readelf -Ws main.elf > elf_symbols.txt
          aarch64-linux-gnu-readelf -r main.elf > elf_relocations.txt

      - name: Disassemble ELF
        run: |
          aarch64-linux-gnu-objdump -d -C main.elf > disassembly.txt
          grep -Ein 'PlayerInput|JoyPadAccel|Throw|Cappy|Npad|JoySingle|JoyDual|Motion' elf_symbols.txt disassembly.txt > symbol_hits.txt || true

      - name: Targeted reference scan
        shell: bash
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          dis = Path("disassembly.txt").read_text(errors="replace")
          hits = re.findall(
              r'(?s)(?=^\s*[0-9a-f]+ <[^>]*(?:PlayerInput|CapThrow|Throw|Motion|JoyPadAccel|Npad)[^>]*>:\n.*?)(?=^\s*[0-9a-f]+ <[^>]+>:\n|\Z)',
              dis,
              re.M,
          )
          Path("targeted_functions.txt").write_text("\n\n".join(hits[:300]), encoding="utf-8")
          print("targeted function blocks:", len(hits))
          PY

      - name: Upload reverse engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: smo-main-reverse-engineering
          path: |
            main.elf
            elf_header.txt
            elf_sections.txt
            elf_symbols.txt
            elf_relocations.txt
            disassembly.txt
            symbol_hits.txt
            targeted_functions.txt
          if-no-files-found: error
